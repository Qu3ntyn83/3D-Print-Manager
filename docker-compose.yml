services:
  # Dienst- und Containername bleiben "3d-manager", damit bestehende Installationen und Skripte weiterlaufen
  3d-manager:
    # Fertiges Image (amd64/arm64) aus GitHub Actions – oder selbst bauen mit "build: ."
    image: ghcr.io/qu3ntyn83/3d-print-manager:latest
    build: .
    container_name: 3d-manager
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      - TZ=Europe/Berlin
      # SEED=1 → leere Datenbank beim ersten Start mit Beispiel-Inventar füllen
      - SEED=0
      # Backups landen standardmäßig in ./data/backups – oder z. B. auf einem NAS-Share:
      # - BACKUP_DIR=/backups
      # Druckdateien der Bibliothek woanders ablegen (z. B. NAS), max. Größe je Datei:
      # - LIBRARY_DIR=/library
      # - LIBRARY_MAX_MB=500
      # Slicer-Dienst (siehe unten). Standard ist http://slicer:8080 – leer lassen schaltet ihn ab:
      # - SLICER_URL=
      # Demo ohne Bambu-Account: Beispiel-Spulen der Cloud-Bibliothek laden
      # - BAMBU_MOCK=/app/mock_spools.json
    # Falls der Container keine Namen auflösen kann ("Could not resolve host"):
    # dns:
    #   - 192.168.1.1   # eigener Router/Firewall
    #   - 1.1.1.1
    volumes:
      - ./data:/data
      # - /mnt/nas/3d-manager-backups:/backups
      # - /mnt/nas/3d-druckdateien:/library

  # Optional: Slicer-Dienst – berechnet Druckzeit und Filament für 3MF-Projekte, die ohne Slice-Daten
  # gespeichert wurden (normale Bambu-Studio-Projekte, MakerWorld-Downloads). Bambu Studio auf der Kommandozeile,
  # ca. 1,2 GB, nur amd64. Starten mit:   docker compose --profile slicer up -d
  # (dauerhaft: COMPOSE_PROFILES=slicer in die Datei .env neben dieser Datei schreiben)
  slicer:
    profiles: ["slicer"]
    image: ghcr.io/qu3ntyn83/3d-print-manager-slicer:latest
    build: ./slicer
    container_name: 3d-manager-slicer
    restart: unless-stopped
    # kein "ports:" – der Dienst ist nur für den 3D Print Manager im internen Docker-Netz erreichbar
    environment:
      - SLICE_TIMEOUT=1200   # Sekunden je Projekt
