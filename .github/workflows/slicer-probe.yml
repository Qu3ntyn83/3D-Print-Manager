name: Slicer-Probe
on:
  push:
    branches: [probe/slicer]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view --repo bambulab/BambuStudio --json tagName,assets -q '.tagName, (.assets[] | "\(.name) \(.size)")'
          gh release download --repo bambulab/BambuStudio --pattern '*buntu-24.04*.AppImage' -O bs.AppImage || gh release download --repo bambulab/BambuStudio --pattern '*.AppImage' -D dl
          ls -la . dl 2>/dev/null || true
      - name: Entpacken
        run: |
          f=$(ls bs.AppImage dl/*.AppImage 2>/dev/null | head -1); chmod +x "$f"; "$f" --appimage-extract >/dev/null; ls squashfs-root | head -30; du -sh squashfs-root
      - name: Fixtures
        run: |
          curl -sSL -o duck.3mf https://raw.githubusercontent.com/MarcinZukowski/filadeep/HEAD/web/models/duck.3mf
          curl -sSL -o multi.3mf https://raw.githubusercontent.com/GhsVilela/FF-3MF-Converter/HEAD/tests/fixtures/multi-plate-preview.3mf
          ls -la *.3mf
      - name: Slicen ohne Zusatzpakete
        continue-on-error: true
        run: |
          cd squashfs-root && (time ./AppRun --slice 0 --debug 2 --export-3mf $PWD/../out1.3mf $PWD/../duck.3mf) 2>&1 | tail -40; ls -la ../out1.3mf && unzip -p ../out1.3mf Metadata/slice_info.config | head -40
      - name: Fehlende Bibliotheken
        run: |
          cd squashfs-root && ldd bin/bambu-studio 2>/dev/null | grep "not found" || echo "alle Bibliotheken vorhanden"; ls bin | head
      - name: Slicen mit Paketen
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libegl1 libgtk-3-0t64 libwebkit2gtk-4.1-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 xvfb >/dev/null
          cd squashfs-root && ldd bin/bambu-studio 2>/dev/null | grep "not found" || echo "alle Bibliotheken vorhanden"
          (time ./AppRun --slice 0 --debug 2 --export-3mf $PWD/../out2.3mf $PWD/../duck.3mf) 2>&1 | tail -40; ls -la ../out2.3mf && unzip -p ../out2.3mf Metadata/slice_info.config | head -60
          (time ./AppRun --slice 0 --debug 2 --export-3mf $PWD/../out3.3mf $PWD/../multi.3mf) 2>&1 | tail -30; ls -la ../out3.3mf && unzip -p ../out3.3mf Metadata/slice_info.config | grep -E "index|prediction|weight|<filament" | head -40
      - name: Mit xvfb
        continue-on-error: true
        run: |
          cd squashfs-root && (time xvfb-run -a ./AppRun --slice 0 --debug 2 --export-3mf $PWD/../out4.3mf $PWD/../duck.3mf) 2>&1 | tail -30; ls -la ../out4.3mf && unzip -p ../out4.3mf Metadata/slice_info.config | grep -E "index|prediction|weight|<filament" | head
